if (bamBtn) {
bamBtn.addEventListener('click', () => {
    // Flash the screen (the "troll" effect)
    const flash = document.createElement('div');
    flash.style.position = 'fixed';
    flash.style.inset = '0';
    flash.style.backgroundColor = 'white';
    flash.style.zIndex = '9999';
    flash.style.opacity = '0';
    flash.style.transition = 'opacity 0.05s ease-in';
    document.body.appendChild(flash);

    // Trigger flash
    requestAnimationFrame(() => {
        flash.style.opacity = '1';
        setTimeout(() => {
            flash.style.transition = 'opacity 1.5s ease-out';
            flash.style.opacity = '0';
            setTimeout(() => flash.remove(), 1500);
        }, 100);
    });

    // Create Anime-style "Light Bang" Particles
    for (let i = 0; i < 40; i++) {
        createParticle();
    }
});
}

function createParticle() {
    const particle = document.createElement('div');
    const size = Math.random() * 100 + 50;
    const angle = Math.random() * Math.PI * 2;
    const velocity = Math.random() * 20 + 10;
    
    particle.className = 'absolute pointer-events-none rounded-full';
    particle.style.width = `${size}px`;
    particle.style.height = `${size}px`;
    particle.style.left = '50%';
    particle.style.top = '50%';
    
    // Anime palette: White core with hints of cyan, yellow, and magenta
    const colors = ['#ffffff', '#ffffff', '#00f0ff', '#ff00ff', '#ffff00'];
    particle.style.background = `radial-gradient(circle, ${colors[0]} 0%, ${colors[Math.floor(Math.random() * colors.length)]} 70%, transparent 100%)`;
    particle.style.boxShadow = `0 0 40px ${colors[Math.floor(Math.random() * colors.length)]}`;
    
    container.appendChild(particle);

    const destX = Math.cos(angle) * velocity * 50;
    const destY = Math.sin(angle) * velocity * 50;

    const anim = particle.animate([
        { transform: 'translate(-50%, -50%) scale(0)', opacity: 1 },
        { transform: `translate(calc(-50% + ${destX}px), calc(-50% + ${destY}px)) scale(2)`, opacity: 0 }
    ], {
        duration: 600 + Math.random() * 400,
        easing: 'cubic-bezier(0.1, 0.8, 0.3, 1)',
        fill: 'forwards'
    });

    anim.onfinish = () => particle.remove();
}

})();

        ];
        
        const bgImg = document.getElementById('bg-image');
        const prevBtn = document.getElementById('prev-bg-btn');
        const nextBtn = document.getElementById('next-bg-btn');

        let isTransitioning = false;
        let autoScrollTimer = null;
        let autoScrollRAF = null;
        let scrollDirection = 1; // 1 = down, -1 = up

        const getRandomSrc = () => {
            if (bgImages.length === 0) return null;
            let randomIndex = Math.floor(Math.random() * bgImages.length);
            if (bgImages.length > 1) {
                const currentSrc = bgImg.getAttribute('src');
                while (bgImages[randomIndex] === currentSrc) {
                    randomIndex = Math.floor(Math.random() * bgImages.length);
                }
            }
            return bgImages[randomIndex];
        };

        // --- Auto-scroll system ---
        const SCROLL_SPEED = 0.4; // pixels per frame (~24px/sec at 60fps)
        const PAUSE_MS = 2500;
        let isAutoScrolling = false;
        let rightClickHeld = false;
        let userInterruptTimer = null;
        let isPausedAtBoundary = false; // true while waiting at top/bottom edge

        const stopAutoScroll = () => {
            if (autoScrollTimer) { clearTimeout(autoScrollTimer); autoScrollTimer = null; }
            if (autoScrollRAF) { cancelAnimationFrame(autoScrollRAF); autoScrollRAF = null; }
            if (userInterruptTimer) { clearTimeout(userInterruptTimer); userInterruptTimer = null; }
            isAutoScrolling = false;
            isPausedAtBoundary = false;
        };

        const doScrollStep = () => {
            if (rightClickHeld) {
                autoScrollRAF = requestAnimationFrame(doScrollStep);
                return;
            }

            const maxScroll = document.documentElement.scrollHeight - window.innerHeight;

            if (maxScroll <= 0) {
                autoScrollRAF = requestAnimationFrame(doScrollStep);
                return;
            }

            window.scrollBy(0, SCROLL_SPEED * scrollDirection);
            const afterScroll = window.scrollY;

            if (scrollDirection === 1 && afterScroll >= maxScroll - 1) {
                // Reached bottom — pause then scroll up
                scrollDirection = -1;
                isAutoScrolling = false;
                isPausedAtBoundary = true;
                autoScrollTimer = setTimeout(() => {
                    isPausedAtBoundary = false;
                    isAutoScrolling = true;
                    autoScrollRAF = requestAnimationFrame(doScrollStep);
                }, PAUSE_MS);
                return;
            }

            if (scrollDirection === -1 && afterScroll <= 1) {
                // Reached top — pause then scroll down
                scrollDirection = 1;
                isAutoScrolling = false;
                isPausedAtBoundary = true;
                autoScrollTimer = setTimeout(() => {
                    isPausedAtBoundary = false;
                    isAutoScrolling = true;
                    autoScrollRAF = requestAnimationFrame(doScrollStep);
                }, PAUSE_MS);
                return;
            }

            autoScrollRAF = requestAnimationFrame(doScrollStep);
        };

        let isResettingToTop = false;

        const startAutoScroll = () => {
            stopAutoScroll();
            scrollDirection = 1;

            const currentPos = window.scrollY;
            if (currentPos <= 1) {
                isResettingToTop = false;
                autoScrollTimer = setTimeout(() => {
                    isAutoScrolling = true;
                    autoScrollRAF = requestAnimationFrame(doScrollStep);
                }, PAUSE_MS);
                return;
            }

            isResettingToTop = true;
            const RESET_SPEED = 3;

            const resetStep = () => {
                window.scrollBy(0, -RESET_SPEED);
                if (window.scrollY <= 1) {
                    window.scrollTo(0, 0);
                    isResettingToTop = false;
                    autoScrollTimer = setTimeout(() => {
                        isAutoScrolling = true;
                        autoScrollRAF = requestAnimationFrame(doScrollStep);
                    }, PAUSE_MS);
                    return;
                }
                autoScrollRAF = requestAnimationFrame(resetStep);
            };
            autoScrollRAF = requestAnimationFrame(resetStep);
        };

        const resumeAutoScroll = () => {
            if (autoScrollTimer) { clearTimeout(autoScrollTimer); autoScrollTimer = null; }
            if (autoScrollRAF) { cancelAnimationFrame(autoScrollRAF); autoScrollRAF = null; }
            if (userInterruptTimer) { clearTimeout(userInterruptTimer); userInterruptTimer = null; }

            userInterruptTimer = setTimeout(() => {
                isAutoScrolling = true;
                autoScrollRAF = requestAnimationFrame(doScrollStep);
            }, PAUSE_MS);
        };

        const pauseForUserAction = () => {
            if (autoScrollRAF) { cancelAnimationFrame(autoScrollRAF); autoScrollRAF = null; }
            if (autoScrollTimer) { clearTimeout(autoScrollTimer); autoScrollTimer = null; }
            isAutoScrolling = false;
            isPausedAtBoundary = false;
            resumeAutoScroll();
        };

        // --- User interaction handlers ---

        window.addEventListener('contextmenu', (e) => e.preventDefault());
        window.addEventListener('mousedown', (e) => {
            if (isResettingToTop || isPausedAtBoundary) return;
            if (e.button === 2) {
                rightClickHeld = true;
                if (userInterruptTimer) { clearTimeout(userInterruptTimer); userInterruptTimer = null; }
            }
        });
        window.addEventListener('mouseup', (e) => {
            if (isResettingToTop || isPausedAtBoundary) return;
            if (e.button === 2 && rightClickHeld) {
                rightClickHeld = false;
                if (!isAutoScrolling && !autoScrollRAF) {
                    resumeAutoScroll();
                }
            }
        });

        let ignoreScrollEvents = false;
        window.addEventListener('scroll', () => {
            if (ignoreScrollEvents || isResettingToTop || isPausedAtBoundary) return;
            if (isAutoScrolling) {
                pauseForUserAction();
            } else if (!autoScrollRAF && !rightClickHeld) {
                resumeAutoScroll();
            }
        }, { passive: true });

        const originalScrollBy = window.scrollBy.bind(window);
        window.scrollBy = function(x, y) {
            ignoreScrollEvents = true;
            originalScrollBy(x, y);
            requestAnimationFrame(() => { ignoreScrollEvents = false; });
        };

        // Click: pause and resume after 2.5s
        window.addEventListener('click', (e) => {
            if (isResettingToTop) return;
            if (e.target.closest('#prev-bg-btn') || e.target.closest('#next-bg-btn')) return;
            pauseForUserAction();
        });

        // --- Background transition ---
        const transitionBg = (direction) => {
            if (isTransitioning) return;
            const newSrc = getRandomSrc();
            if (!newSrc) return;

            isTransitioning = true;
            stopAutoScroll();

            const newImg = document.createElement('img');
            newImg.src = newSrc;
            newImg.className = bgImg.className;
            newImg.classList.add('absolute', 'top-0', 'left-0');
            
            if (direction === 'next') {
                newImg.style.transform = 'translateX(100%)';
            } else {
                newImg.style.transform = 'translateX(-100%)';
            }
            
            newImg.style.transition = 'transform 0.6s cubic-bezier(0.25, 1, 0.5, 1)';
            bgImg.style.transition = 'transform 0.6s cubic-bezier(0.25, 1, 0.5, 1)';
            
            bgImg.parentNode.insertBefore(newImg, bgImg);
            
            // Trigger reflow
            void newImg.offsetWidth;
            
            newImg.style.transform = 'translateX(0)';
            if (direction === 'next') {
                bgImg.style.transform = 'translateX(-100%)';
            } else {
                bgImg.style.transform = 'translateX(100%)';
            }
            
            setTimeout(() => {
                bgImg.src = newSrc;
                bgImg.style.transform = '';
                bgImg.style.transition = '';
                newImg.remove();
                isTransitioning = false;
                // Reset to top and restart auto-scroll cycle
                startAutoScroll();
            }, 600);
        };

        if (bgImg) {
            // Set a random background immediately on load without transition
            const initSrc = getRandomSrc();
            if (initSrc) bgImg.src = initSrc;

            // Start auto-scroll on initial load
            startAutoScroll();

            if (prevBtn && nextBtn) {
                prevBtn.addEventListener('click', () => transitionBg('prev'));
                nextBtn.addEventListener('click', () => transitionBg('next'));
            }
        }
    });
